
<style>
*{margin:0;padding:0;box-sizing:border-box;}
.hero{
  width:100%;
  height:540px;
  background:#060606;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.bg-img{
  position:absolute;
  top:-8%;left:-4%;
  width:108%;height:116%;
  background-image:url('/mnt/user-data/uploads/Unrivalled-Classical-Art.jpg');
  background-size:cover;
  background-position:center right;
  filter:grayscale(100%) brightness(0.38) contrast(1.1);
  animation:slowdrift 18s ease-in-out infinite alternate;
  transform-origin:center center;
}
@keyframes slowdrift{
  0%  {transform:scale(1.04) translateX(0px)   translateY(0px);}
  33% {transform:scale(1.06) translateX(-8px)  translateY(-4px);}
  66% {transform:scale(1.05) translateX(6px)   translateY(-6px);}
  100%{transform:scale(1.04) translateX(-4px)  translateY(4px);}
}
.veil-canvas{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  opacity:0.18;
  z-index:2;
}
.fade-left{
  position:absolute;
  top:0;left:0;bottom:0;
  width:42%;
  background:linear-gradient(to right, #060606 30%, transparent);
  z-index:3;
}
.fade-right{
  position:absolute;
  top:0;right:0;bottom:0;
  width:20%;
  background:linear-gradient(to left, #060606, transparent);
  z-index:3;
}
.fade-bottom{
  position:absolute;
  bottom:0;left:0;right:0;
  height:200px;
  background:linear-gradient(to bottom, transparent, #060606);
  z-index:3;
}
.fade-top{
  position:absolute;
  top:0;left:0;right:0;
  height:100px;
  background:linear-gradient(to top, transparent, #060606);
  z-index:3;
}
.hero-content{
  position:relative;
  z-index:10;
  text-align:left;
  color:#e8e8e2;
  padding-left:52px;
  align-self:center;
  width:100%;
  max-width:960px;
  padding-right:52px;
}
.eyebrow{
  font-family:Georgia,serif;
  font-size:10px;
  letter-spacing:0.32em;
  color:#5a5a56;
  text-transform:uppercase;
  margin-bottom:22px;
}
.headline{
  font-family:Georgia,serif;
  font-size:48px;
  font-weight:400;
  line-height:1.15;
  letter-spacing:-0.02em;
  color:#deded8;
  margin-bottom:22px;
}
.subline{
  font-family:Georgia,serif;
  font-size:15px;
  color:#6a6a64;
  letter-spacing:0.02em;
  max-width:400px;
  line-height:1.75;
  margin-bottom:36px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.tag{
  font-size:10px;
  letter-spacing:0.12em;
  padding:4px 12px;
  border:0.5px solid rgba(255,255,255,0.12);
  color:#6a6a64;
  font-family:Georgia,serif;
}
</style>

<div class="hero">
  <div class="bg-img"></div>
  <canvas class="veil-canvas" id="vc"></canvas>
  <div class="fade-left"></div>
  <div class="fade-right"></div>
  <div class="fade-top"></div>
  <div class="fade-bottom"></div>
  <div class="hero-content">
    <div class="eyebrow">Veilwork</div>
    <div class="headline">Defense technology<br>built from the<br>ground up.</div>
    <div class="subline">Independent research and development at the intersection of autonomous systems, computer vision, and unmanned aerial platforms.</div>
    <div class="tags">
      <span class="tag">Autonomous systems</span>
      <span class="tag">Counter-UAS</span>
      <span class="tag">Visual navigation</span>
      <span class="tag">Celestial navigation</span>
      <span class="tag">NDAA compliant</span>
      <span class="tag">Edge AI</span>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('vc');
const cx = cv.getContext('2d');

function rsz(){
  cv.width  = cv.offsetWidth;
  cv.height = cv.offsetHeight;
}
rsz();
window.addEventListener('resize', rsz);

const N = 24;
let lines = [];

function init(){
  lines = [];
  const W = cv.width, H = cv.height;
  for(let i=0;i<N;i++){
    const x = (i/(N-1))*W;
    const pts = [];
    const segs = 20;
    for(let s=0;s<=segs;s++){
      pts.push({
        ox: x,
        oy: (s/segs)*H,
        phase: Math.random()*Math.PI*2,
        amp: 6+Math.random()*14,
        spd: 0.00015+Math.random()*0.0001
      });
    }
    lines.push({pts, bright: 30+Math.floor(Math.random()*30)});
  }
}
init();

let T=0;
function draw(){
  const W=cv.width,H=cv.height;
  cx.clearRect(0,0,W,H);
  T++;
  for(let l=0;l<lines.length;l++){
    const ln=lines[l];
    const pts=ln.pts;
    cx.beginPath();
    const p0=pts[0];
    const x0=p0.ox+Math.sin(T*p0.spd*1000+p0.phase)*p0.amp;
    cx.moveTo(x0,p0.oy);
    for(let s=1;s<pts.length;s++){
      const p=pts[s];
      const frac=s/(pts.length-1);
      const drape=Math.sin(frac*Math.PI)*0.8+0.2;
      const wx=Math.sin(T*p.spd*1000+p.phase)*p.amp*drape;
      const wy=Math.sin(T*p.spd*500+p.phase*0.7)*2*drape;
      if(s===1){
        cx.lineTo(p.ox+wx, p.oy+wy);
      } else {
        const pp=pts[s-1];
        const ppfrac=(s-1)/(pts.length-1);
        const ppd=Math.sin(ppfrac*Math.PI)*0.8+0.2;
        const ppx=Math.sin(T*pp.spd*1000+pp.phase)*pp.amp*ppd;
        const ppy=Math.sin(T*pp.spd*500+pp.phase*0.7)*2*ppd;
        const mx=(pp.ox+ppx+p.ox+wx)/2;
        const my=(pp.oy+ppy+p.oy+wy)/2;
        cx.quadraticCurveTo(pp.ox+ppx,pp.oy+ppy,mx,my);
      }
    }
    const b=ln.bright;
    const cd=Math.abs(ln.pts[0].ox-W/2)/(W/2);
    const alpha=0.06+(1-cd)*0.12;
    cx.strokeStyle=`rgba(${b},${b},${b},${alpha})`;
    cx.lineWidth=0.5+(1-cd)*0.6;
    cx.stroke();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
